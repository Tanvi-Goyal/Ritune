name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            17
            25

      - uses: gradle/actions/setup-gradle@v6

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RITUNE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::RITUNE_KEYSTORE_BASE64 is not set"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: Build signed release
        env:
          RITUNE_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          RITUNE_KEYSTORE_PASSWORD: ${{ secrets.RITUNE_KEYSTORE_PASSWORD }}
          RITUNE_KEY_ALIAS: ${{ secrets.RITUNE_KEY_ALIAS }}
          RITUNE_KEY_PASSWORD: ${{ secrets.RITUNE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease :app:bundleRelease -PversionName=${GITHUB_REF_NAME#v}

      - name: Verify APK signature
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --generate-notes \
            app/build/outputs/apk/release/app-release.apk \
            app/build/outputs/bundle/release/app-release.aab \
            app/build/outputs/mapping/release/mapping.txt