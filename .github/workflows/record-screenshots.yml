name: Record screenshots

# Records goldens on the CI OS. Robolectric renders them identically on macOS today, so local
# recordRoborazziDebug works too; use this without a local setup or if the two ever diverge.
# Run from the Actions tab or add the "record-screenshots" label to a PR, then commit the result:
#   gh run download <run-id> --name screenshots
on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  record:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'record-screenshots'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            17
            25

      - uses: gradle/actions/setup-gradle@v6

      - name: Record screenshots
        run: ./gradlew recordRoborazziDebug

      - name: Upload screenshots
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: '**/src/test/screenshots/*.png'
          if-no-files-found: error
