name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      # 17 for the module toolchains; 25 last so it becomes JAVA_HOME for the Gradle daemon.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            17
            25

      - uses: gradle/actions/setup-gradle@v6

      - name: Lint, unit and screenshot tests, coverage, debug and release builds
        run: >-
          ./gradlew
          :app:lintDebug
          testDebugUnitTest
          verifyRoborazziDebug
          :koverXmlReportCoverage
          :koverHtmlReportCoverage
          :app:assembleDebug
          :app:assembleRelease

      - name: Coverage summary
        if: always()
        run: |
          report=build/reports/kover/reportCoverage.xml
          [ -f "$report" ] || exit 0
          line=$(grep -oE '<counter type="LINE" missed="[0-9]+" covered="[0-9]+"/>' "$report" | tail -1)
          missed=$(echo "$line" | sed -E 's/.*missed="([0-9]+)".*/\1/')
          covered=$(echo "$line" | sed -E 's/.*covered="([0-9]+)".*/\1/')
          percent=$(awk "BEGIN { printf \"%.1f\", 100 * $covered / ($covered + $missed) }")
          echo "### Line coverage: ${percent}% (${covered} of $((covered + missed)) lines)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload screenshot diffs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: screenshot-diffs
          path: '**/build/outputs/roborazzi/'
          if-no-files-found: ignore

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk

  instrumented:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            17
            25

      - uses: gradle/actions/setup-gradle@v6

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Locate Android SDK
        id: sdk
        run: echo "path=$ANDROID_HOME" >> "$GITHUB_OUTPUT"

      - name: Cache managed device system image
        uses: actions/cache@v6
        with:
          path: |
            ~/.android/gradle/avd
            ${{ steps.sdk.outputs.path }}/system-images/android-34/aosp_atd
          key: gmd-pixel6Api34-aosp-atd-${{ runner.os }}

      - name: Instrumented tests on a Gradle Managed Device
        run: >-
          ./gradlew pixel6Api34DebugAndroidTest
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
          -Pandroid.experimental.testOptions.managedDevices.maxConcurrentDevices=1

      - name: Upload instrumented test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: instrumented-results
          path: |
            **/build/outputs/androidTest-results/
            **/build/reports/androidTests/
          if-no-files-found: ignore
