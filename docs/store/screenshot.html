<!doctype html>
<html><head><meta charset="utf-8"><style>
@font-face{font-family:Manrope;font-weight:800;src:url(../../core/designsystem/src/main/res/font/manrope_extrabold.ttf)}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden}
body{background:#0B4A3A;font-family:Manrope;display:flex;flex-direction:column;align-items:center}
h1{margin:0;height:400px;box-sizing:border-box;padding:0 90px;display:flex;align-items:center;justify-content:center;text-align:center;color:#F7F6F2;font-weight:800;font-size:72px;line-height:1.15;letter-spacing:-1px;text-wrap:balance}
img{height:1480px;border-radius:44px;border:6px solid #0F6E56}
</style></head><body>
<h1 id="c"></h1><img id="s" alt="">
<script>
const q=new URLSearchParams(location.search);
document.getElementById('c').textContent=q.get('caption');
document.getElementById('s').src='../screenshots/'+q.get('shot')+'.png';
</script>
</body></html>
