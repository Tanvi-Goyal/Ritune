name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, MAJOR.MINOR.PATCH (e.g. 1.0.1)'
        required: true
        type: string
      upload_to_play:
        description: 'Upload the AAB to Play internal testing as a draft'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: play-release

    steps:
      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]{1,2}\.[0-9]{1,2}\.[0-9]{1,2}$ ]]; then
            echo "::error::version must be MAJOR.MINOR.PATCH with each part 0-99, was '$VERSION'"; exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" >/dev/null 2>&1; then
            echo "::error::tag v$VERSION already exists"; exit 1
          fi

      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            17
            25

      - uses: gradle/actions/setup-gradle@v6

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RITUNE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::RITUNE_KEYSTORE_BASE64 is not set"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: Build signed release
        env:
          RITUNE_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          RITUNE_KEYSTORE_PASSWORD: ${{ secrets.RITUNE_KEYSTORE_PASSWORD }}
          RITUNE_KEY_ALIAS: ${{ secrets.RITUNE_KEY_ALIAS }}
          RITUNE_KEY_PASSWORD: ${{ secrets.RITUNE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease :app:bundleRelease -PversionName=${{ inputs.version }}

      - name: Verify APK signature
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Upload to Play (internal, draft)
        if: ${{ inputs.upload_to_play }}
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.ritune
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: draft
          mappingFile: app/build/outputs/mapping/release/mapping.txt
          whatsNewDirectory: distribution/whatsnew

      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ inputs.version }}" --target "$GITHUB_SHA" --generate-notes \
            app/build/outputs/apk/release/app-release.apk \
            app/build/outputs/bundle/release/app-release.aab \
            app/build/outputs/mapping/release/mapping.txt

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
